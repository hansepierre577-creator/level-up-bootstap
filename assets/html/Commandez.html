    <script>
(function(){
    const phone = '50940357607';
    const storageKey = 'levelup_cart';
    const cart = JSON.parse(localStorage.getItem(storageKey) || '{}');
    const cartItemsEl = document.getElementById('cart-items');
    const cartEmptyEl = document.getElementById('cart-empty');
    const sendCartBtn = document.getElementById('send-cart');
    const clearCartBtn = document.getElementById('clear-cart');
    const cartCountEl = document.getElementById('cart-count');
    let currentLang = localStorage.getItem('levelup_language') || 'fr';

    function saveCart() {
        localStorage.setItem(storageKey, JSON.stringify(cart));
    }

    function getProductInfo(link) {
        const figure = link.closest('figure');
        const title = figure?.querySelector('figcaption')?.textContent?.trim();
        const price = parseFloat(figure?.dataset.price) || 0;
        const name = title || figure?.querySelector('img')?.alt?.trim() || 'Produit';
        return { name, price };
    }

    function renderCart() {
        const entries = Object.entries(cart);
        cartItemsEl.innerHTML = '';
        const totalItems = entries.reduce((sum, [_, item]) => sum + item.qty, 0);
        cartCountEl.textContent = totalItems;
        document.getElementById('cart-items-count').textContent = totalItems;
        sendCartBtn.disabled = entries.length === 0;
        clearCartBtn.disabled = entries.length === 0;
        if (entries.length === 0) {
            cartEmptyEl.style.display = 'block';
            return;
        }
        cartEmptyEl.style.display = 'none';
        entries.forEach(([name, item]) => {
            const li = document.createElement('li');
            li.className = 'list-group-item d-flex justify-content-between align-items-center';
            li.innerHTML = ` 
                <span>${name} <strong>x${item.qty}</strong></span>
                <button type="button" class="btn btn-sm btn-outline-danger remove-item">Supprimer</button>
            `;
            li.querySelector('.remove-item').addEventListener('click', () => {
                delete cart[name];
                saveCart();
                renderCart();
            });
            cartItemsEl.appendChild(li);
        });
    }

    function addToCart(productInfo, link) {
        const { name, price } = productInfo;
        if (cart[name]) {
            cart[name].qty++;
        } else {
            cart[name] = { qty: 1, price: price };
        }
        saveCart();
        renderCart();
        if (link) {
            link.textContent = (translations[currentLang] || translations.fr).addedToCart;
            setTimeout(() => link.textContent = (translations[currentLang] || translations.fr).addToCart, 800);
        }
    }

    function sendCart() {
        const entries = Object.entries(cart);
        if (!entries.length) return;
        const lines = ['Bonjour, je souhaite commander :'];
        let totalAmount = 0;
        entries.forEach(([name, item]) => {
            const itemTotal = item.qty * item.price;
            lines.push(`- ${name} (x${item.qty}) : $${itemTotal.toFixed(2)}`);
            lines.push(`- ${name} (x${item.qty}) : ${itemTotal}$`);
            totalAmount += itemTotal;
        });
        lines.push('');
        lines.push(`Total de la commande : ${totalAmount}$`);
        lines.push('', 'Merci.');
        const url = `https://wa.me/${phone}?text=${encodeURIComponent(lines.join('\n'))}`;
        window.open(url, '_blank');
    }

    const cartToggle = document.getElementById('cart-toggle');
    const cartClose = document.getElementById('cart-close');
    const cartPanel = document.getElementById('cart-panel');

    function openCart() {
        cartPanel.classList.add('cart-open');
        cartPanel.setAttribute('aria-hidden', 'false');
    }

    function closeCart() {
        cartPanel.classList.remove('cart-open');
        cartPanel.setAttribute('aria-hidden', 'true');
    }

    cartToggle.addEventListener('click', openCart);
    cartClose.addEventListener('click', closeCart);
    sendCartBtn.addEventListener('click', sendCart);
    clearCartBtn.addEventListener('click', () => { 
        Object.keys(cart).forEach(key => delete cart[key]);
        saveCart();
        renderCart();
    });

    document.querySelectorAll('.button a[href*="wa.me"]').forEach(link => {
        link.textContent = 'Ajouter au panier';
        link.addEventListener('click', event => {
            event.preventDefault();
            const productInfo = getProductInfo(event.currentTarget);
            addToCart(productInfo, event.currentTarget);
        });
    });

    renderCart();

    // --- Dark Mode Logic ---
    // This logic assumes a toggle button with id="darkModeToggle" exists somewhere on the page
    // or it will just apply the theme based on localStorage.
    const body = document.body;
    const darkModeKey = 'levelup_darkMode';

    function applyDarkMode() {
        const savedDarkMode = localStorage.getItem(darkModeKey);
        if (savedDarkMode === 'enabled') {
            body.classList.add('dark-mode');
        } else {
            body.classList.remove('dark-mode');
        }
    }
    applyDarkMode();
    window.addEventListener('storage', (e) => {
        if (e.key === darkModeKey) applyDarkMode();
    });

})();
</script>
