<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion - Level-Up</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="../css/login.css">
    <link rel="stylesheet" href="../css/theme.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm sticky-top">
        <div class="container">
            <a class="navbar-brand d-flex align-items-center fw-bold" href="levelup.html">
                <img src="../img/levelupindustry.JPEG" alt="Logo Level-Up" class="levelup me-2">
                <span class="text-uppercase">Level-Up</span>
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#authNavbar" aria-controls="authNavbar" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="authNavbar">
                <ul class="navbar-nav ms-auto align-items-lg-center">
                    <li class="nav-item"><a class="nav-link" href="levelup.html" data-i18n="accueil">Accueil</a></li>
                    <li class="nav-item"><a class="nav-link" href="Commandez.html" data-i18n="produits">Produits</a></li>
                    <li class="nav-item"><a class="nav-link" href="contact.html" data-i18n="contact">Contact</a></li>
                    <li class="nav-item"><a class="nav-link" href="register.html" data-i18n="createAccount">Créer un compte</a></li>
                    <li class="nav-item ms-lg-2">
                        <button id="darkModeToggle" class="btn btn-link text-white" type="button" aria-label="Activer le mode sombre" title="Mode sombre">
                            <i class="bi bi-moon-fill"></i>
                        </button>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <main class="container">
        <div class="row justify-content-center align-items-center login-shell">
            <div class="col-md-8 col-lg-6 col-xl-5">
                <div class="card login-card shadow-lg">
                    <div class="card-body p-4 p-md-5">
                        <div class="text-center mb-4">
                            <a href="levelup.html" class="navbar-brand-login">
                                <img src="../img/levelupindustry.JPEG" alt="Logo Level-Up" class="logo-img mb-2">
                                <h2 class="fw-bold" data-i18n="loginTitle">Connexion</h2>
                            </a>
                        </div>

                        <!-- Formulaire de Connexion -->
                        <div id="alert-placeholder"></div>

                        <form id="loginForm" class="needs-validation" novalidate>
                            <div class="mb-3">
                                <label for="email" class="form-label" data-i18n="emailLabel">Adresse Email</label>
                                <input type="email" class="form-control" id="email" required>
                                <div class="invalid-feedback" data-i18n="emailInvalid">
                                    Veuillez entrer une adresse email valide.
                                </div>
                            </div>

                            <div class="mb-3">
                                <label for="password" class="form-label" data-i18n="passwordLabel">Mot de passe</label>
                                <input type="password" class="form-control" id="password" maxlength="128" required>
                            </div>

                            <div class="d-flex justify-content-between align-items-center mb-4">
                                <div class="form-check">
                                    <input class="form-check-input" type="checkbox" value="" id="rememberMe">
                                    <label class="form-check-label" for="rememberMe" data-i18n="rememberMe">
                                        Se souvenir de moi
                                    </label>
                                </div>
                                <a href="#" class="small text-decoration-none link-golden" data-i18n="forgotPassword">Mot de passe oublié?</a>
                            </div>

                            <div class="d-grid">
                                <button type="submit" class="btn btn-primary-golden" id="loginButton" data-i18n="loginButton">Se connecter</button>
                            </div>

                            <div class="text-center mt-4">
                                <p class="mb-0" data-i18n="noAccount">
                                    Pas encore de compte? <a href="register.html" class="fw-bold text-decoration-none link-golden" data-i18n="createAccount">Créer un compte</a>
                                </p>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script src="../js/api-config.js"></script>
    <script src="../js/translations.js"></script>
    <script src="../js/theme.js"></script>
    <script>
        const API_BASE = window.LEVELUP_API.apiUrl;

        // --- Logique de validation Bootstrap ---
        (function () {
            'use strict'
            var forms = document.querySelectorAll('.needs-validation')
            Array.prototype.slice.call(forms)
                .forEach(function (form) {
                    form.addEventListener('submit', async function (event) {
                        event.preventDefault();
                        if (!form.checkValidity()) {
                            event.stopPropagation()
                        } else {
                            await handleLogin();
                        }

                        form.classList.add('was-validated')
                    }, false)
                })
        })();

        // --- Logique pour soumettre le formulaire de connexion ---
        async function handleLogin() {
            const loginButton = document.getElementById('loginButton');
            const alertPlaceholder = document.getElementById('alert-placeholder');

            const loginData = {
                email: document.getElementById('email').value,
                password: document.getElementById('password').value
            };

            loginButton.disabled = true;
            loginButton.innerHTML = '<span class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></span> Connexion...';

            try {
                const response = await fetch(API_BASE('/api/auth/login'), {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(loginData)
                });

                const result = await response.json();

                if (result.success) {
                    // Stocker le token pour garder l'utilisateur connecté
                    localStorage.setItem('levelup_token', result.token);
                    showAlert(result.message, 'success');
                    
                    // Rediriger vers la page d'accueil après 2 secondes
                    setTimeout(() => {
                        window.location.href = 'levelup.html';
                    }, 2000);
                } else {
                    showAlert(result.message, 'danger');
                    loginButton.disabled = false;
                    loginButton.textContent = "Se connecter";
                }

            } catch (error) {
                console.error("Erreur:", error);
                showAlert('Une erreur s\'est produite. Veuillez réessayer.', 'danger');
                loginButton.disabled = false;
                loginButton.textContent = "Se connecter";
            }
        }

        function showAlert(message, type) {
            const alertPlaceholder = document.getElementById('alert-placeholder');
            const wrapper = document.createElement('div');
            wrapper.innerHTML = [
                `<div class="alert alert-${type} alert-dismissible" role="alert">`,
                `   <div>${message}</div>`,
                '   <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>',
                '</div>'
            ].join('');

            alertPlaceholder.innerHTML = '';
            alertPlaceholder.append(wrapper);
        }
    </script>
</body>
</html>
