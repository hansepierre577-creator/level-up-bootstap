<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Créer un Compte - Level-Up</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="../css/login.css"> <!-- Réutilisation du même CSS -->
    <link rel="stylesheet" href="../css/theme.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm sticky-top">
        <div class="container">
            <a class="navbar-brand d-flex align-items-center fw-bold" href="levelup.html">
                <img src="../img/levelupindustry.JPEG" alt="Logo Level-Up" class="levelup me-2">
                <span class="text-uppercase">Level-Up</span>
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#authNavbar" aria-controls="authNavbar" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="authNavbar">
                <ul class="navbar-nav ms-auto align-items-lg-center">
                    <li class="nav-item"><a class="nav-link" href="levelup.html" data-i18n="accueil">Accueil</a></li>
                    <li class="nav-item"><a class="nav-link" href="Commandez.html" data-i18n="produits">Produits</a></li>
                    <li class="nav-item"><a class="nav-link" href="contact.html" data-i18n="contact">Contact</a></li>
                    <li class="nav-item"><a class="nav-link" href="login.html" data-i18n="connexion">Connexion</a></li>
                    <li class="nav-item ms-lg-2">
                        <button id="darkModeToggle" class="btn btn-link text-white" type="button" aria-label="Activer le mode sombre" title="Mode sombre">
                            <i class="bi bi-moon-fill"></i>
                        </button>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <main class="container">
        <div class="row justify-content-center align-items-center login-shell py-4">
            <div class="col-md-8 col-lg-6 col-xl-5">
                <div class="card login-card shadow-lg">
                    <div class="card-body p-4 p-md-5">
                        <div class="text-center mb-4">
                            <a href="levelup.html" class="navbar-brand-login">
                                <img src="../img/levelupindustry.JPEG" alt="Logo Level-Up" class="logo-img mb-2">
                                <h2 class="fw-bold" data-i18n="registerTitle">Créer un Compte</h2>
                            </a>
                        </div>

                        <!-- Formulaire d'Enregistrement -->
                        <div id="alert-placeholder"></div>

                        <form id="registerForm" class="needs-validation" novalidate>
                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label for="firstName" class="form-label">Prénom</label>
                                    <input type="text" class="form-control" id="firstName" required>
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label for="lastName" class="form-label">Nom</label>
                                    <input type="text" class="form-control" id="lastName" required>
                                </div>
                            </div>

                            <div class="mb-3">
                                <label for="email" class="form-label">Adresse Email</label>
                                <input type="email" class="form-control" id="email" required>
                            </div>

                            <div class="mb-3">
                                <label for="password" class="form-label">Mot de passe</label>
                                    <input type="password" class="form-control" id="password" minlength="12" maxlength="128" required>
                            </div>

                            <div class="mb-4">
                                <label for="confirmPassword" class="form-label">Confirmer le mot de passe</label>
                                <input type="password" class="form-control" id="confirmPassword" minlength="12" maxlength="128" required>
                            </div>

                            <div class="d-grid">
                                <button type="submit" class="btn btn-primary-golden" id="registerButton">S'inscrire</button>
                            </div>

                            <div class="text-center mt-4">
                                <p class="mb-0">
                                    Déjà un compte? <a href="login.html" class="fw-bold text-decoration-none link-golden">Se connecter</a>
                                </p>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script src="../js/api-config.js"></script>
    <script src="../js/translations.js"></script>
    <script src="../js/theme.js"></script>
    <script>
        const API_BASE = window.LEVELUP_API.apiUrl;

        // --- Logique de validation Bootstrap ---
        (function () {
            'use strict'
            var forms = document.querySelectorAll('.needs-validation')
            Array.prototype.slice.call(forms)
                .forEach(function(form) {
                    form.addEventListener('submit', async function(event) {
                        event.preventDefault();

                        // Logique de vérification de mot de passe
                        const password = document.getElementById('password');
                        const confirmPassword = document.getElementById('confirmPassword');
                        if (password.value !== confirmPassword.value) {
                            confirmPassword.setCustomValidity("Les mots de passe ne correspondent pas.");
                        } else {
                            confirmPassword.setCustomValidity("");
                        }

                        if (!form.checkValidity()) {
                            event.stopPropagation()
                        } else {
                            // Si fòmilè a valid, voye done yo
                            await handleRegistration();
                        }

                        form.classList.add('was-validated')
                    }, false)
                })
        })();

        // --- Logique pour le thème sombre ---
        (function() {
            const body = document.body;
            const darkModeKey = 'levelup_darkMode';
            function applyDarkMode() {
                const savedDarkMode = localStorage.getItem(darkModeKey);
                if (savedDarkMode === 'enabled') {
                    body.classList.add('dark-mode');
                } else {
                    body.classList.remove('dark-mode');
                }
            }
            applyDarkMode();
            window.addEventListener('storage', (e) => {
                if (e.key === darkModeKey) applyDarkMode();
            });
        })();

        // --- Logique pour soumettre le formulaire d'inscription ---
        async function handleRegistration() {
            const registerButton = document.getElementById('registerButton');
            const alertPlaceholder = document.getElementById('alert-placeholder');

            const userData = {
                firstName: document.getElementById('firstName').value,
                lastName: document.getElementById('lastName').value,
                email: document.getElementById('email').value,
                password: document.getElementById('password').value
            };

            // Affiche un spinner sur le bouton
            registerButton.disabled = true;
            registerButton.innerHTML = '<span class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></span> Inscription...';

            try {
                const response = await fetch(API_BASE('/api/auth/register'), {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(userData)
                });

                const result = await response.json();

                if (result.success) {
                    showAlert(result.message, 'success');
                    // Redirige vers la page de connexion après 3 secondes
                    setTimeout(() => {
                        window.location.href = 'login.html';
                    }, 3000);
                } else {
                    showAlert(result.message, 'danger');
                    registerButton.disabled = false;
                    registerButton.textContent = "S'inscrire";
                }

            } catch (error) {
                console.error("Erreur:", error);
                showAlert('Une erreur s\'est produite. Veuillez réessayer.', 'danger');
                registerButton.disabled = false;
                registerButton.textContent = "S'inscrire";
            }
        }

        function showAlert(message, type) {
            const alertPlaceholder = document.getElementById('alert-placeholder');
            const wrapper = document.createElement('div');
            wrapper.innerHTML = [
                `<div class="alert alert-${type} alert-dismissible" role="alert">`,
                `   <div>${message}</div>`,
                '   <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>',
                '</div>'
            ].join('');

            alertPlaceholder.innerHTML = ''; // Vide les anciennes alertes
            alertPlaceholder.append(wrapper);
        }
    </script>
</body>
</html>
